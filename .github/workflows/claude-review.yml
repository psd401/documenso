name: Claude Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
jobs:
  claude-review:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write # caller must grant; org default token is read-only and reusables cannot elevate
    # Dependabot-triggered callers cannot grant id-token: write to the
    # reusable — startup_failure. The reusable also self-guards; both needed.
    if: github.actor != 'dependabot[bot]'
    # @main is deliberate: org-owned reusable; central bumps must propagate
    # (psd-dev-standards standards/06). zizmor: ignore[unpinned-uses]
    uses: PSD401/.github/.github/workflows/reusable-claude-review.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
  # Dependabot PRs aren't reviewed, but production repos require a
  # `claude-review / claude-review` check, and the skipped job above reports
  # only `claude-review`. This job has the same name and calls a no-op
  # reusable, so the required context passes (PSD401/.github#27).
  claude-review-dependabot:
    name: claude-review
    permissions: {}
    if: github.actor == 'dependabot[bot]'
    uses: PSD401/.github/.github/workflows/reusable-claude-review-skip.yml@main # zizmor: ignore[unpinned-uses]
