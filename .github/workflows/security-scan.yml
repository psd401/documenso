name: Security Scan
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    permissions:
      contents: read
    uses: PSD401/.github/.github/workflows/reusable-security-scan.yml@06915064e7cec3fcabdeac5425d2c205c4628ae4 # v1.15.0
    # v1.15.0, not the newest release: from v1.16.0 the reusable fails on
    # zizmor findings of medium severity, and this fork's workflows have 20
    # (11 artipacked, 9 excessive-permissions; run 45738810440). v1.15.0
    # fails on high severity only and already has the license step.
    with:
      # The org CodeBuild runner where this repo is in its runner group, a
      # GitHub-hosted runner otherwise (psd-dev-standards standards/04 rule 21).
      runner: ${{ vars.PSD_LINUX_RUNNER || 'github' }}
      # The license step is part of security-scan since v1.8.0. This fork
      # keeps upstream's AGPL-3.0 (psd-dev-standards standards/01, Licensing).
      # The step greps LICENSE for the identifier, and the file's title is
      # "GNU AFFERO GENERAL PUBLIC LICENSE", so the identifier is "AFFERO".
      allowed_spdx: "AFFERO"
