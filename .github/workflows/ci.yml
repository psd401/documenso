name: 'Continuous Integration'

on:
  workflow_call:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_app:
    name: Build App
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: ./.github/actions/node-install

      - name: Copy env
        run: cp .env.example .env

      - name: Build app
        run: npm run build

  build_docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          push: false
          load: true
          context: .
          file: ./docker/Dockerfile
          tags: documenso-${{ github.sha }}

      - name: Smoke test — document-conversion deps in the runtime image
        run: |
          # Regression guard (#95/#96, #28 encrypted): the runtime image must ship LibreOffice
          # (soffice) + Liberation fonts for .docx/.doc upload, and qpdf for encrypted-PDF
          # decryption, or those uploads fail with DEPENDENCY_MISSING. convert-to-pdf.ts and
          # decrypt-pdf.ts resolve the binaries via `which`, so assert both are on PATH.
          docker run --rm documenso-${{ github.sha }} sh -c 'command -v soffice'
          docker run --rm documenso-${{ github.sha }} sh -c 'command -v qpdf'
          docker run --rm documenso-${{ github.sha }} sh -c 'fc-list | grep -iq liberation'
